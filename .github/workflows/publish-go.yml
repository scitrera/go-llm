# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Publish (Go)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test-go.yml

  verify-tag:
    name: Verify tag matches go-llm version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Verify versions are in sync
        run: uvx --from 'scitrera-repo-tools==0.1.28' sync-versions --check --verbose

      - name: Compare tag against versions.yaml
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(uvx --from 'scitrera-repo-tools==0.1.28' sync-versions --print-version go-llm)"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the go-llm version declared in versions.yaml ($declared)"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches versions.yaml ($declared)."

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [ tests, verify-tag ]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
