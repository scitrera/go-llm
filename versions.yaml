# Authoritative version for go-llm.
# Run: sync-versions             to apply
# Run: sync-versions --check     to verify (CI-friendly)

# One module, one number, one tag. The protocol and client packages ship
# together — the client consumes the protocol types directly, so a protocol
# change is a client change — and sharing a module makes that lockstep
# structural instead of a pair of version pins somebody has to move together.
#
# A Go module has no version manifest: its version *is* the `vX.Y.Z` git tag. So
# this file and the tag are the only two places the number lives, and
# publish-go.yml refuses to release when they disagree.
go-llm: 0.2.0

project_rules:
  go-llm:
    # Declares the module for CI (test-go, publish-go) and rewrites nothing.
    - { type: gomod,      path: go.mod }
    # `const Version = "..."` in the root package, which exists to hold it. The
    # client's default User-Agent is built from it, so a release that forgot to
    # sync would announce the wrong version on every request.
    - { type: go_version, path: version.go }

# A minimum, not a pin: it admits this toolchain and every later one.
#
# Raised from 1.25.0 to 1.25.13 for the stdlib fixes govulncheck reports as
# reachable from this module: GO-2026-5026 (net/http -> x/net/idna Punycode),
# GO-2026-5972 (encoding/asn1 recursion depth), GO-2026-6090 (crypto/tls
# post-handshake message limit) and GO-2026-6218 (quadratic net/url.resolvePath).
# All four are fixed in 1.25.13. Nothing here needs a language feature newer
# than 1.25 — this is a security floor, which is the one thing the `go`
# directive can express to consumers.
#
# Three-part on purpose — Go 1.21+ canonicalises the directive, and a two-part
# `go 1.25` makes `go build` refuse with "updates to go.mod needed" outside a
# workspace, which is exactly what CI is.
go_toolchain:
  go: "1.25.13"

ci:
  test_branches: [ main ]
  # Pinned deliberately: a bare `scitrera-repo-tools` floats to the newest
  # release, which is the same unpinned-tooling drift version-check exists to
  # catch. 0.1.28 is the floor for this file — `ci.go.verify_tag_version` is new
  # in it, and an older repo-tools rejects the key outright rather than ignoring
  # it.
  repo_tools_source: "scitrera-repo-tools==0.1.28"
  # Drives publish-go.yml, which for a library is one job: gate on the Go tests,
  # then cut the release for the tag. Nothing is attached to it — there is no
  # artifact, since `go get` resolves the version from the proxy by tag — so the
  # release exists for its notes.
  github_release: true
  go:
    # Exact, and it has to be: `1.25` looks like it tracks the newest patch, but
    # setup-go runs with check-latest false, so it prefers whatever 1.25.x the
    # runner already has cached. That is how the first run landed on 1.25.12 and
    # failed govulncheck on four advisories fixed in 1.25.13. Naming the version
    # makes the runner fetch it rather than settle for its cache. Raise this in
    # lockstep with go_toolchain.go above; the govulncheck job runs
    # GOTOOLCHAIN=local, so a CI toolchain below the module's minimum cannot
    # build at all.
    go_version: "1.25.13"
    test_args: "-race -count=1"
    # Refuse to release when the pushed tag disagrees with this file. A Go
    # module's version *is* its tag, so a wrong one is not a mislabelled
    # artifact that can be re-uploaded — it is the published version, and the
    # proxy is built to keep it that way.
    verify_tag_version: go-llm
